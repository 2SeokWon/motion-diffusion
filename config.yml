data:
  raw_dir:       ./data/raw
  processed_dir: ./data/processed
  control_dir:   ./data/control
  stats_dir:     ./data/processed/stats_train   # 학습 구간만으로 계산한 정규화 통계 (scripts/split_stats.py)
  test_ratio:    0.15                           # 각 파일의 뒤 15%는 평가용 (학습 창과 겹치지 않음)

model:
  njoints:            23
  seq_len:            180
  latent_dim:         512    # 약 2,500만 파라미터 (데이터 약 76분 기준, MDM ~2천만 수준)
  ff_size:            2048
  num_layers:         8
  num_heads:          8
  dropout:            0.1
  # Feature dims per joint
  root_features:      4   # hip Y(1) + delta xz yaw(3)
  position_features:  3   # local position per joint
  rotation_features:  6   # 6D rotation per joint
  foot_features:      2   # RightToe, LeftToe contact
  cond_features:      3   # waypoint traj (x, z, yaw), 모델 입력 조건 = 값 3 + 마스크 1

waypoint:
  max_waypoints: 10     # 시작/도착 외 중간 경유점 최대 개수 (0~max 랜덤)
  dense_prob:    0.1    # 전체 궤적을 조건으로 주는 확률

diffusion:
  num_timesteps: 1000
  beta_start:    0.0001
  beta_end:      0.02

training:
  seed:            42
  total_steps:     300000 # 창이 1프레임씩 겹쳐 에폭은 의미가 약하므로 스텝으로 학습 길이를 정한다
  batch_size:      64
  num_workers:     16
  learning_rate:   1.0e-4 # YAML(PyYAML)은 '1e-4'를 문자열로 읽으므로 소수점을 넣는다
  min_lr:          1.0e-5 # 코사인 감소의 끝 값
  warmup_steps:    2000   # 0 → learning_rate 선형 증가
  weight_decay:    0.05
  ema_decay:       0.9999 # 생성에는 EMA 가중치를 쓴다
  log_interval:    100    # 학습 손실 기록 (스텝)
  eval_interval:   5000   # 평가 손실 측정 (스텝)
  eval_windows:    2048   # 평가 손실에 쓰는 고정 평가 창 수 (t, 노이즈, 마스크 모두 시드 고정)
  save_interval:   10000  # last.pt 갱신 (스텝). best.pt는 평가 손실이 좋아질 때마다 저장
  snapshot_interval: 50000 # 이 간격마다 step_XXXXXX.pt를 따로 남긴다
  class_drop:      0.1    # CFG: 클래스만 드롭하는 확률
  cond_drop:       0.1    # CFG: 경유점 조건만 드롭하는 확률
  joint_drop:      0.1    # CFG: 클래스 + 경유점 동시 드롭 확률 (샘플링의 uncond 분기)
  feat_bias:       15.0   # root(0:4) std를 나누는 값 → root 정밀도 향상
  checkpoint_dir:  ./checkpoints

generation:
  guidance_scale:    3.0
  skeleton_template: ./data/raw/Aeroplane_BR.bvh
  output_dir:        ./results
