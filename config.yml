data:
  raw_dir:       ./data/raw
  processed_dir: ./data/processed
  control_dir:   ./data/control
  stats_dir:     ./data/processed/stats_train   # 학습 구간만으로 계산한 정규화 통계 (scripts/split_stats.py)
  test_ratio:    0.15                           # 각 파일의 뒤 15%는 평가용 (학습 창과 겹치지 않음)

model:
  njoints:            23
  seq_len:            180
  latent_dim:         1024
  ff_size:            4096
  num_layers:         8
  num_heads:          8
  dropout:            0.1
  # Feature dims per joint
  root_features:      4   # hip Y(1) + delta xz yaw(3)
  position_features:  3   # local position per joint
  rotation_features:  6   # 6D rotation per joint
  foot_features:      2   # RightToe, LeftToe contact
  cond_features:      3   # waypoint traj (x, z, yaw), 모델 입력 조건 = 값 3 + 마스크 1

waypoint:
  max_waypoints: 10     # 시작/도착 외 중간 경유점 최대 개수 (0~max 랜덤)
  dense_prob:    0.1    # 전체 궤적을 조건으로 주는 확률

diffusion:
  num_timesteps: 1000
  beta_start:    0.0001
  beta_end:      0.02

training:
  seed:            42
  num_epochs:      500
  batch_size:      64
  num_workers:     16
  learning_rate:   1e-4
  weight_decay:    0.05
  lr_anneal_steps: 500000
  save_interval:   5      # epochs between checkpoints
  class_drop:      0.1    # CFG: 클래스만 드롭하는 확률
  cond_drop:       0.1    # CFG: 경유점 조건만 드롭하는 확률
  joint_drop:      0.1    # CFG: 클래스 + 경유점 동시 드롭 확률 (샘플링의 uncond 분기)
  feat_bias:       15.0   # root(0:4) std를 나누는 값 → root 정밀도 향상
  checkpoint_dir:  ./checkpoints

generation:
  guidance_scale:    3.0
  skeleton_template: ./data/raw/Aeroplane_BR.bvh
  output_dir:        ./results
